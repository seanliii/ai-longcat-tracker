const openSourceDate=new Date("2026-07-15T00:00:00+08:00");
let currentView="grid";
let searchQuery="";
let activeFilter="全部";
const categories=["技术突破", "模型发布", "组织变革", "开源计划", "生态进展", "性能评测"];

function updateCountdown(){
const now=new Date();
const diff=openSourceDate-now;
if(diff<=0){
document.getElementById("countdown").innerHTML='<div class="countdown-item"><div class="value">已开源</div><div class="label">LongCat-2.0</div></div>';
return;
}
const days=Math.floor(diff/(1000*60*60*24));
const hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
const minutes=Math.floor((diff%(1000*60*60))/(1000*60));
const items=[{value:days,label:"天"},{value:hours,label:"时"},{value:minutes,label:"分"}];
document.getElementById("countdown").innerHTML=items.map(i=>`<div class="countdown-item"><div class="value">${i.value}</div><div class="label">${i.label}</div></div>`).join("");
}
setInterval(updateCountdown,60000);
updateCountdown();

function renderStats(){
const completed=trackerData.filter(d=>d.status==="已完成").length;
const inProgress=trackerData.filter(d=>d.status==="进行中").length;
const techBreakthrough=trackerData.filter(d=>d.category==="技术突破").length;
const ecoProgress=trackerData.filter(d=>d.category==="生态进展").length;
const openSource=trackerData.filter(d=>d.category==="开源计划").length;
const stats=[
{label:"追踪项目",value:trackerData.length},
{label:"技术突破",value:techBreakthrough},
{label:"生态进展",value:ecoProgress},
{label:"已完成",value:completed},
{label:"进行中",value:inProgress},
{label:"开源计划",value:openSource}
];
document.getElementById("stats").innerHTML=stats.map(s=>`<div class="stat-card"><div class="value">${s.value}</div><div class="label">${s.label}</div></div>`).join("");
}

function renderFilters(){
const filterGroup=document.getElementById("filterGroup");
const allCategories=["全部",...categories];
filterGroup.innerHTML=allCategories.map(c=>`<button class="filter-btn ${c===activeFilter?"active":""}" data-filter="${c}">${c}</button>`).join("");
filterGroup.querySelectorAll(".filter-btn").forEach(btn=>{
btn.addEventListener("click",()=>{
activeFilter=btn.dataset.filter;
searchQuery="";
document.getElementById("searchInput").value="";
renderFilters();
renderAll();
});
});
}

function getFilteredData(){
let data=trackerData;
if(activeFilter!=="全部")data=data.filter(d=>d.category===activeFilter);
if(searchQuery){
const q=searchQuery.toLowerCase();
data=data.filter(d=>d.name.toLowerCase().includes(q)||d.description.toLowerCase().includes(q)||d.status.toLowerCase().includes(q)||d.highlights.some(h=>h.toLowerCase().includes(q))||d.keyInfo.some(k=>k.toLowerCase().includes(q)));
}
return data;
}

function renderGrid(){
const data=getFilteredData();
const grid=document.getElementById("gridView");
if(!data.length){grid.innerHTML='<div class="empty-state">没有找到匹配的项目</div>';return;}
grid.innerHTML=data.map(item=>`<div class="card" onclick="openModal(${item.id})"><div class="card-header"><div class="card-title">${item.name}</div><span class="card-badge badge-category-${item.category}">${item.category}</span></div><div class="card-meta"><span>${item.date}</span><span class="card-badge badge-status-${item.status}">${item.status}</span></div><div class="card-desc">${item.description}</div><div class="card-tags">${item.highlights.map(h=>`<span class="card-tag">${h}</span>`).join("")}</div></div>`).join("");
}

function renderTimeline(){
const data=getFilteredData();
const timeline=document.getElementById("timelineView");
if(!data.length){timeline.innerHTML='<div class="empty-state">没有找到匹配的项目</div>';return;}
timeline.innerHTML=data.map(item=>`<div class="timeline-item"><div class="timeline-date">${item.date}</div><div class="timeline-content" onclick="openModal(${item.id})"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><strong style="color:#f8fafc;">${item.name}</strong><span class="card-badge badge-category-${item.category}">${item.category}</span></div><div style="color:#64748b;font-size:0.85rem;margin-bottom:8px;">${item.date} · ${item.status}</div><div style="color:#94a3b8;font-size:0.9rem;">${item.description}</div></div></div>`).join("");
}

function renderTable(){
const data=getFilteredData();
const table=document.getElementById("tableView");
if(!data.length){table.innerHTML='<div class="empty-state">没有找到匹配的项目</div>';return;}
table.innerHTML='<table><thead><tr><th>名称</th><th>分类</th><th>日期</th><th>状态</th><th>亮点</th></tr></thead><tbody>'+data.map(item=>`<tr onclick="openModal(${item.id})" style="cursor:pointer;"><td><strong>${item.name}</strong></td><td><span class="card-badge badge-category-${item.category}">${item.category}</span></td><td>${item.date}</td><td><span class="card-badge badge-status-${item.status}">${item.status}</span></td><td>${item.highlights.slice(0,2).join(", ")}</td></tr>`).join("")+'</tbody></table>';
}

function renderAll(){renderGrid();renderTimeline();renderTable();}

function switchView(view){
currentView=view;
document.getElementById("gridView").style.display=view==="grid"?"grid":"none";
document.getElementById("timelineView").style.display=view==="timeline"?"block":"none";
document.getElementById("tableView").style.display=view==="table"?"block":"none";
document.querySelectorAll(".view-btn").forEach(btn=>btn.classList.toggle("active",btn.dataset.view===view));
}

document.querySelectorAll(".view-btn").forEach(btn=>btn.addEventListener("click",()=>switchView(btn.dataset.view)));
document.getElementById("searchInput").addEventListener("input",(e)=>{searchQuery=e.target.value.trim();renderAll();});

window.openModal=function(id){
const item=trackerData.find(d=>d.id===id);
if(!item)return;
document.getElementById("modalTitle").textContent=item.name;
let sourcesHtml="";
if(item.sources&&item.sources.length){
sourcesHtml='<div class="modal-section"><div class="modal-section-title">信息来源</div><div class="modal-section-content">'+item.sources.map(s=>`<a href="${s.url}" target="_blank" class="modal-link">${s.title}</a>`).join("<br>")+'</div></div>';
}
document.getElementById("modalBody").innerHTML='<div class="modal-section"><div class="modal-section-title">项目概述</div><div class="modal-section-content">'+item.description+'</div></div><div class="modal-section"><div class="modal-section-title">关键信息</div><div class="modal-section-content">'+item.keyInfo.map(k=>`<div class="highlight-box"><strong>${k.split("：")[0]}：</strong>${k.split("：").slice(1).join("：")}</div>`).join("")+'</div></div><div class="modal-section"><div class="modal-section-title">核心亮点</div><div class="modal-section-content">'+item.highlights.map(h=>`<span class="modal-tag">${h}</span>`).join("")+'</div></div>'+sourcesHtml;
document.getElementById("modalOverlay").classList.add("active");
};

window.closeModal=function(){document.getElementById("modalOverlay").classList.remove("active");};
document.getElementById("modalOverlay").addEventListener("click",(e)=>{if(e.target===document.getElementById("modalOverlay"))closeModal();});
document.addEventListener("keydown",(e)=>{if(e.key==="Escape")closeModal();});

renderStats();
renderFilters();
renderAll();
})();
</script>
</body>
</html>
